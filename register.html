<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Omar Web</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="darkModeToggle" class="dark-btn">
        ☀️ Light Mode
    </button>

    <div id="toast"></div>

    <div class="container">

        <form id="registerForm" class="form">

            <div class="logo">O</div>

            <h2>Create Account 🚀</h2>

            <p class="subtitle">
                Create your new account
            </p>


            <!-- Full Name -->

            <div class="input-box">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

                <small id="nameError"></small>

            </div>


            <!-- Email -->

            <div class="input-box">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <small id="emailError"></small>

            </div>


            <!-- Username -->

            <div class="input-box">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                >

                <small id="registerUserError"></small>

            </div>


            <!-- Password -->

            <div class="input-box">

                <label for="registerPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                    >

                    <button
                        type="button"
                        id="toggleRegisterPassword"
                        class="show-btn"
                    >
                        Show
                    </button>

                </div>

                <small id="registerPassError"></small>

            </div>


            <!-- Confirm Password -->

            <div class="input-box">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                >

                <small id="confirmPassError"></small>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Create Account →
            </button>


            <p id="registerMessage"></p>


            <p class="create">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
